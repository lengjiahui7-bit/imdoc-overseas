<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IMDOC 海外就医</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #C8384E;
    --red-btn: #C8384E;
    --tag-bg: #FCE9EC;
    --tag-text: #C8384E;
    --ink: #2B2B33;
    --sub: #9A9AA2;
    --line: #EFEFF2;
    --bg: #FFFFFF;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #000;
    color: var(--ink);
    overflow: hidden;
  }
  /* phone frame */
  .phone {
    position: relative;
    width: 100vw;
    max-width: 420px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
  }

  /* ---- generic screen (stacked, animated) ---- */
  .screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .32s cubic-bezier(.4,.0,.2,1);
    z-index: 1;
  }
  .screen.active { transform: translateX(0); z-index: 2; }
  .screen.behind { transform: translateX(-24%); z-index: 0; }
  /* home doesn't slide from right on first load */
  #home { transform: translateX(0); }
  #home.behind { transform: translateX(-24%); }

  /* ---- status bar ---- */
  .statusbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    flex-shrink: 0;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .statusbar .icons svg { display: block; }

  /* ================= HOME ================= */
  #home { background: #fff; overflow-y: auto; }
  .home-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 20px 18px;
  }
  .home-user { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: #E7ECF3; display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 30px; height: 30px; }
  .login-txt { color: var(--red); font-size: 19px; font-weight: 700; }
  .pin { color: var(--red); }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 20px 4px; padding: 0 14px;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .cell .ico {
    width: 62px; height: 62px; border-radius: 50%;
    background: #EAF0F6; display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .cell .lbl { font-size: 13.5px; color: #33333B; }
  .cell.hl .ico { outline: 2px dashed var(--red); outline-offset: 2px; }

  .sec-title { font-size: 19px; font-weight: 700; padding: 26px 20px 12px; }
  .promo {
    margin: 0 16px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(135deg, #F0632B, #E8531F);
    padding: 20px 18px; color: #fff; position: relative; min-height: 150px;
  }
  .promo .kicker { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .promo h3 { font-size: 21px; color: #3a1f6e; line-height: 1.35; font-weight: 800; }
  .promo .note {
    margin-top: 14px; background: #F5C542; color: #4a2f00;
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; max-width: 62%;
  }
  .promo .face {
    position: absolute; right: 10px; bottom: 0; font-size: 78px;
  }
  .rail { display: flex; gap: 12px; padding: 14px 16px 90px; overflow-x: auto; }
  .rail .item { flex: 0 0 128px; }
  .rail .thumb { width: 128px; height: 96px; border-radius: 10px; background: #DDE8F2; }
  .rail .cap { font-size: 14px; margin-top: 8px; }

  .tabbar {
    position: sticky; bottom: 0; left: 0; right: 0;
    height: 68px; background: #fff; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-around;
    flex-shrink: 0;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--sub); }
  .tab.on { color: var(--red); }
  .tab .ti { font-size: 20px; }

  /* ================= LOADING ================= */
  #loading { background: #fff; z-index: 5; transition: opacity .25s ease; }
  #loading.active { z-index: 6; }
  #loading.fade { opacity: 0; }
  .load-head {
    height: 56px; display: flex; align-items: center; padding: 0 18px; gap: 14px; flex-shrink: 0;
  }
  .load-head .back { font-size: 22px; color: #444; }
  .load-head .ttl { font-size: 18px; color: #333; font-weight: 500; }
  .load-head .pin { margin-left: auto; }
  .load-body { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spinner-wrap { position: relative; width: 120px; height: 120px; }
  .logo-dot {
    position: absolute; inset: 18px; border-radius: 50%;
    background: var(--red); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 18px rgba(200,56,78,.35);
  }
  .logo-dot svg { width: 46px; height: 46px; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: var(--red);
    border-right-color: var(--red);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= HOSPITAL LIST ================= */
  #list { background: #fff; }
  .list-head {
    height: 52px; display: flex; align-items: center; padding: 0 16px; gap: 14px;
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .list-head .back { font-size: 22px; color: #444; }
  .list-head .ttl { font-size: 17px; font-weight: 600; }
  .list-head .search { margin-left: auto; font-size: 18px; color: #666; }

  .filters { padding: 12px 14px 6px; flex-shrink: 0; }
  .frow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .frow::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-size: 12.5px; padding: 5px 12px; border-radius: 14px;
    background: #F3F4F6; color: #555; white-space: nowrap;
  }
  .chip.on { background: var(--tag-bg); color: var(--tag-text); }
  .chip.pin { display: inline-flex; align-items: center; gap: 3px; }

  .cards { flex: 1; overflow-y: auto; padding: 6px 14px 24px; }
  .hcard {
    display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .hcard .pic {
    width: 92px; height: 92px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg,#cdd8e6,#aebfd4);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;
  }
  .hcard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hcard .hname { font-size: 15px; font-weight: 600; color: #222; line-height: 1.35; }
  .hcard .rank { font-size: 12px; color: var(--red); margin-top: 6px; line-height: 1.5; }
  .hcard .country { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .hcard .pick {
    align-self: flex-end; margin-top: auto;
    background: var(--red-btn); color: #fff; font-size: 12.5px;
    padding: 5px 18px; border-radius: 14px; border: none;
  }
  .dots { text-align: center; color: #ccc; padding: 8px 0 4px; letter-spacing: 4px; }
</style>
</head>
<body>
<div class="phone">

  <!-- ================= HOME ================= -->
  <section class="screen" id="home">
    <div class="statusbar">
      <span>11:17</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#bbb"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 3c2.2 0 4.2.8 5.7 2.2l1.1-1.2C13.5 2.3 11.1 1.3 8.5 1.3S3.5 2.3 1.7 4l1.1 1.2C4.3 3.8 6.3 3 8.5 3z" fill="#000"/><path d="M8.5 6.4c1.2 0 2.3.5 3.1 1.2l1.1-1.1C11.7 5.5 10.2 4.9 8.5 4.9S5.3 5.5 4.3 6.5l1.1 1.1C6.2 6.9 7.3 6.4 8.5 6.4z" fill="#000"/><circle cx="8.5" cy="9.6" r="1.4" fill="#000"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="3" y="3" width="8" height="7" rx="1.5"/><rect x="23" y="4.5" width="2" height="4" rx="1" fill="#000" fill-opacity=".4"/></svg>
      </span>
    </div>

    <div class="home-top">
      <div class="home-user">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="#C8384E"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </div>
        <span class="login-txt">注册/登录</span>
      </div>
      <span class="pin">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="#C8384E"><path d="M10 0C4.5 0 0 4.4 0 9.9 0 17 10 24 10 24s10-7 10-14.1C20 4.4 15.5 0 10 0zm0 13.5a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg>
      </span>
    </div>

    <div class="grid">
      <div class="cell"><div class="ico">🩺</div><div class="lbl">远程在线问诊</div></div>
      <div class="cell"><div class="ico">🏥</div><div class="lbl">IMDOC AI</div></div>
      <div class="cell"><div class="ico">🏪</div><div class="lbl">延长生命商店</div></div>
      <div class="cell"><div class="ico">👨‍⚕️</div><div class="lbl">全球顶级医生</div></div>
      <div class="cell"><div class="ico">💊</div><div class="lbl">健康商店</div></div>
      <div class="cell"><div class="ico">🩻</div><div class="lbl">医疗级体检</div></div>
      <div class="cell hl" onclick="goOverseas()"><div class="ico">🏨</div><div class="lbl">海外就医</div></div>
      <div class="cell"><div class="ico">➕</div><div class="lbl">更多服务</div></div>
    </div>

    <div class="sec-title">最新活动</div>
    <div class="promo">
      <div class="kicker">衰老细胞清除</div>
      <h3>清除衰老细胞，启动<br>年轻状态</h3>
      <div class="note">全球首个基于 Senolytic 技术的细胞级抗衰方案，临床数据验证30%端粒损耗逆转</div>
      <div class="face">😄</div>
    </div>

    <div class="sec-title">满足你的健康需求</div>
    <div class="rail">
      <div class="item"><div class="thumb"></div><div class="cap">全球临床试验匹配</div></div>
      <div class="item"><div class="thumb"></div><div class="cap">精准肿瘤学分子诊断</div></div>
      <div class="item"><div class="thumb"></div><div class="cap">私人定制药</div></div>
    </div>

    <div class="tabbar">
      <div class="tab on"><span class="ti">🏠</span>首页</div>
      <div class="tab"><span class="ti">📋</span>订单</div>
      <div class="tab"><span class="ti">⭕</span>我的IMDOC</div>
      <div class="tab"><span class="ti">💬</span>客服</div>
      <div class="tab"><span class="ti">⚙️</span>设置</div>
    </div>
  </section>

  <!-- ================= LOADING ================= -->
  <section class="screen" id="loading">
    <div class="statusbar">
      <span>11:17</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1" fill="#bbb"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><circle cx="8.5" cy="9.6" r="1.4"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="3" y="3" width="8" height="7" rx="1.5"/></svg>
      </span>
    </div>
    <div class="load-head">
      <span class="back" onclick="backHome()">←</span>
      <span class="ttl">海外就医</span>
      <span class="pin">
        <svg width="18" height="22" viewBox="0 0 20 24" fill="#C8384E"><path d="M10 0C4.5 0 0 4.4 0 9.9 0 17 10 24 10 24s10-7 10-14.1C20 4.4 15.5 0 10 0zm0 13.5a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg>
      </span>
    </div>
    <div class="load-body">
      <div class="spinner-wrap">
        <div class="ring"></div>
        <div class="logo-dot">
          <!-- stethoscope logo -->
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 8v10a8 8 0 0016 0V8"/>
            <circle cx="14" cy="8" r="2.4" fill="#fff" stroke="none"/>
            <circle cx="30" cy="8" r="2.4" fill="#fff" stroke="none"/>
            <path d="M22 33.5V36a7 7 0 0014 0v-6"/>
            <circle cx="36" cy="27" r="3.2"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= HOSPITAL LIST ================= -->
  <section class="screen" id="list">
    <div class="statusbar">
      <span>08:00</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><circle cx="8.5" cy="9.6" r="1.4"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="3" y="3" width="8" height="7" rx="1.5"/></svg>
      </span>
    </div>
    <div class="list-head">
      <span class="back" onclick="backHome()">←</span>
      <span class="ttl">医院</span>
      <span class="search">🔍</span>
    </div>
    <div class="filters">
      <div class="frow">
        <span class="chip pin on">📍 所有国家</span>
        <span class="chip">美国</span>
        <span class="chip">日本</span>
        <span class="chip">德国</span>
        <span class="chip">英国</span>
      </div>
      <div class="frow">
        <span class="chip">加拿大</span>
        <span class="chip">新加坡</span>
        <span class="chip">中国香港</span>
        <span class="chip">泰国</span>
      </div>
    </div>
    <div class="cards" id="cards"><!-- injected --></div>
  </section>

</div>

<script>
  // ---- hospital data (from 设计稿) ----
  const hospitals = [
    ["MD安德森癌症中心","癌症专科排名 1 (2025年美国医院排名)","美国"],
    ["纪念斯隆凯特琳癌症中心","癌症专科排名 2 (2025年美国医院排名)","美国"],
    ["麻省总医院","癌症专科排名 6，心脏专科排名 8 (2025年医院排名)","美国"],
    ["丹娜法伯癌症研究院","癌症专科排名 3 (2025年美国医院排名)","美国"],
    ["妙佑医疗国际(Mayo Clinic)","癌症专科排名 3 (2025年美国医院排名)","美国"],
    ["克利夫兰医学中心","心脏专科排名 1 及多项专科排名 (2025年美国医院排名)","美国"],
    ["约翰·霍普金斯医院","神经专科排名 1 等多项专科排名 (2025年美国医院排名)","美国"],
    ["波士顿儿童医院","儿科综合排名 1 (2023-24年度)","美国"],
    ["百翰妇女医院","妇产专科排名 (2025年美国医院排名)","美国"],
    ["加州大学旧金山分校医学中心","综合专科排名 (2025年美国医院排名)","美国"],
    ["UCSF医疗中心","综合医院","美国"]
  ];
  const cards = document.getElementById('cards');
  hospitals.forEach(h => {
    const el = document.createElement('div');
    el.className = 'hcard';
    el.innerHTML = `
      <div class="pic">🏥</div>
      <div class="info">
        <div class="hname">${h[0]}</div>
        <div class="rank">${h[1]}</div>
        <div class="country">${h[2]}</div>
        <button class="pick">选择</button>
      </div>`;
    cards.appendChild(el);
  });
  const dots = document.createElement('div');
  dots.className = 'dots'; dots.textContent = '•••';
  cards.appendChild(dots);

  // ---- navigation ----
  const home = document.getElementById('home');
  const loading = document.getElementById('loading');
  const list = document.getElementById('list');

  function goOverseas() {
    // home -> loading
    home.classList.add('behind');
    loading.classList.add('active');
    // show list underneath, then fade the loading layer away
    setTimeout(() => {
      list.classList.add('active');     // list ready underneath
      loading.classList.add('fade');    // loading fades out
      setTimeout(() => {
        loading.classList.remove('active', 'fade');
      }, 260);                          // after fade done, remove loading layer
    }, 1600);
  }

  function backHome() {
    list.classList.remove('active');
    loading.classList.remove('active', 'fade');
    home.classList.remove('behind');
  }
</script>
</body>
</html>
